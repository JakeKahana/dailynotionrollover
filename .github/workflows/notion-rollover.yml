name: Notion Daily Rollover

on:
  schedule:
    - cron: "59 4 * * *" # 11:59 PM EST daily
  workflow_dispatch: # allows manual trigger for testing

jobs:
  rollover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run rollover script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node rollover.js

      # ponytail: GitHub disables cron workflows after 60d of repo inactivity.
      # An empty commit at 50d resets that clock. Bump 50 down if it ever slips.
      - name: Keep schedule alive
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: keep scheduled rollover from being disabled"
            git push
          fi
